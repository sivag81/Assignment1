{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "v1",
      "kind": "Secret",
      "metadata": {
        "name": "database-config",
        "namespace": "bookstore"
      },
      "type": "Opaque",
      "stringData": {
        "BOOK_DATABASE_URL": "postgresql+psycopg://book_user:book_local_demo@book-db:5432/bookdb",
        "ORDER_DATABASE_URL": "postgresql+psycopg://order_user:order_local_demo@order-db:5432/orderdb",
        "BOOK_PASSWORD": "book_local_demo",
        "ORDER_PASSWORD": "order_local_demo"
      }
    },
    {
      "apiVersion": "v1",
      "kind": "ConfigMap",
      "metadata": {
        "name": "book-db-schema",
        "namespace": "bookstore"
      },
      "data": {
        "01-schema.sql": "CREATE TABLE IF NOT EXISTS books (\n  id INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,\n  title VARCHAR(200) NOT NULL,\n  author VARCHAR(200) NOT NULL,\n  price NUMERIC(12,2) NOT NULL CHECK (price > 0)\n);\n"
      }
    },
    {
      "apiVersion": "v1",
      "kind": "PersistentVolumeClaim",
      "metadata": {
        "name": "book-db-data",
        "namespace": "bookstore"
      },
      "spec": {
        "accessModes": [
          "ReadWriteOnce"
        ],
        "resources": {
          "requests": {
            "storage": "1Gi"
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "book-db",
        "namespace": "bookstore"
      },
      "spec": {
        "selector": {
          "app": "book-db"
        },
        "ports": [
          {
            "port": 5432,
            "targetPort": 5432
          }
        ]
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "book-db",
        "namespace": "bookstore"
      },
      "spec": {
        "replicas": 1,
        "strategy": {
          "type": "Recreate"
        },
        "selector": {
          "matchLabels": {
            "app": "book-db"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "book-db"
            }
          },
          "spec": {
            "containers": [
              {
                "name": "postgres",
                "image": "postgres:17-alpine",
                "ports": [
                  {
                    "containerPort": 5432
                  }
                ],
                "env": [
                  {
                    "name": "POSTGRES_DB",
                    "value": "bookdb"
                  },
                  {
                    "name": "POSTGRES_USER",
                    "value": "book_user"
                  },
                  {
                    "name": "POSTGRES_PASSWORD",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "database-config",
                        "key": "BOOK_PASSWORD"
                      }
                    }
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "100m",
                    "memory": "128Mi"
                  },
                  "limits": {
                    "cpu": "500m",
                    "memory": "512Mi"
                  }
                },
                "readinessProbe": {
                  "exec": {
                    "command": [
                      "pg_isready",
                      "-U",
                      "book_user",
                      "-d",
                      "bookdb"
                    ]
                  },
                  "periodSeconds": 5
                },
                "volumeMounts": [
                  {
                    "name": "data",
                    "mountPath": "/var/lib/postgresql/data"
                  },
                  {
                    "name": "schema",
                    "mountPath": "/docker-entrypoint-initdb.d",
                    "readOnly": true
                  }
                ]
              }
            ],
            "volumes": [
              {
                "name": "data",
                "persistentVolumeClaim": {
                  "claimName": "book-db-data"
                }
              },
              {
                "name": "schema",
                "configMap": {
                  "name": "book-db-schema"
                }
              }
            ]
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "book-service",
        "namespace": "bookstore"
      },
      "spec": {
        "selector": {
          "app": "book-service"
        },
        "ports": [
          {
            "port": 8000,
            "targetPort": 8000
          }
        ]
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "book-service",
        "namespace": "bookstore"
      },
      "spec": {
        "replicas": 1,
        "selector": {
          "matchLabels": {
            "app": "book-service"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "book-service"
            }
          },
          "spec": {
            "containers": [
              {
                "name": "book-service",
                "image": "book-service:1.0",
                "imagePullPolicy": "IfNotPresent",
                "ports": [
                  {
                    "containerPort": 8000
                  }
                ],
                "env": [
                  {
                    "name": "DATABASE_URL",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "database-config",
                        "key": "BOOK_DATABASE_URL"
                      }
                    }
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "100m",
                    "memory": "128Mi"
                  },
                  "limits": {
                    "cpu": "500m",
                    "memory": "256Mi"
                  }
                },
                "readinessProbe": {
                  "httpGet": {
                    "path": "/ready",
                    "port": 8000
                  },
                  "periodSeconds": 5
                },
                "livenessProbe": {
                  "httpGet": {
                    "path": "/health",
                    "port": 8000
                  },
                  "initialDelaySeconds": 10,
                  "periodSeconds": 10
                }
              }
            ]
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "ConfigMap",
      "metadata": {
        "name": "order-db-schema",
        "namespace": "bookstore"
      },
      "data": {
        "01-schema.sql": "CREATE TABLE IF NOT EXISTS orders (\n  id INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,\n  book_id INTEGER NOT NULL,\n  quantity INTEGER NOT NULL CHECK (quantity BETWEEN 1 AND 100),\n  unit_price NUMERIC(12,2) NOT NULL,\n  total_price NUMERIC(14,2) NOT NULL,\n  status VARCHAR(20) NOT NULL DEFAULT 'CREATED',\n  created_at TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP\n);\n"
      }
    },
    {
      "apiVersion": "v1",
      "kind": "PersistentVolumeClaim",
      "metadata": {
        "name": "order-db-data",
        "namespace": "bookstore"
      },
      "spec": {
        "accessModes": [
          "ReadWriteOnce"
        ],
        "resources": {
          "requests": {
            "storage": "1Gi"
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "order-db",
        "namespace": "bookstore"
      },
      "spec": {
        "selector": {
          "app": "order-db"
        },
        "ports": [
          {
            "port": 5432,
            "targetPort": 5432
          }
        ]
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "order-db",
        "namespace": "bookstore"
      },
      "spec": {
        "replicas": 1,
        "strategy": {
          "type": "Recreate"
        },
        "selector": {
          "matchLabels": {
            "app": "order-db"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "order-db"
            }
          },
          "spec": {
            "containers": [
              {
                "name": "postgres",
                "image": "postgres:17-alpine",
                "ports": [
                  {
                    "containerPort": 5432
                  }
                ],
                "env": [
                  {
                    "name": "POSTGRES_DB",
                    "value": "orderdb"
                  },
                  {
                    "name": "POSTGRES_USER",
                    "value": "order_user"
                  },
                  {
                    "name": "POSTGRES_PASSWORD",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "database-config",
                        "key": "ORDER_PASSWORD"
                      }
                    }
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "100m",
                    "memory": "128Mi"
                  },
                  "limits": {
                    "cpu": "500m",
                    "memory": "512Mi"
                  }
                },
                "readinessProbe": {
                  "exec": {
                    "command": [
                      "pg_isready",
                      "-U",
                      "order_user",
                      "-d",
                      "orderdb"
                    ]
                  },
                  "periodSeconds": 5
                },
                "volumeMounts": [
                  {
                    "name": "data",
                    "mountPath": "/var/lib/postgresql/data"
                  },
                  {
                    "name": "schema",
                    "mountPath": "/docker-entrypoint-initdb.d",
                    "readOnly": true
                  }
                ]
              }
            ],
            "volumes": [
              {
                "name": "data",
                "persistentVolumeClaim": {
                  "claimName": "order-db-data"
                }
              },
              {
                "name": "schema",
                "configMap": {
                  "name": "order-db-schema"
                }
              }
            ]
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "order-service",
        "namespace": "bookstore"
      },
      "spec": {
        "selector": {
          "app": "order-service"
        },
        "ports": [
          {
            "port": 8000,
            "targetPort": 8000
          }
        ]
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "order-service",
        "namespace": "bookstore"
      },
      "spec": {
        "replicas": 1,
        "selector": {
          "matchLabels": {
            "app": "order-service"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "order-service"
            }
          },
          "spec": {
            "containers": [
              {
                "name": "order-service",
                "image": "order-service:1.0",
                "imagePullPolicy": "IfNotPresent",
                "ports": [
                  {
                    "containerPort": 8000
                  }
                ],
                "env": [
                  {
                    "name": "DATABASE_URL",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "database-config",
                        "key": "ORDER_DATABASE_URL"
                      }
                    }
                  },
                  {
                    "name": "BOOK_SERVICE_URL",
                    "value": "http://book-service:8000"
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "100m",
                    "memory": "128Mi"
                  },
                  "limits": {
                    "cpu": "500m",
                    "memory": "256Mi"
                  }
                },
                "readinessProbe": {
                  "httpGet": {
                    "path": "/ready",
                    "port": 8000
                  },
                  "periodSeconds": 5
                },
                "livenessProbe": {
                  "httpGet": {
                    "path": "/health",
                    "port": 8000
                  },
                  "initialDelaySeconds": 10,
                  "periodSeconds": 10
                }
              }
            ]
          }
        }
      }
    }
  ]
}
